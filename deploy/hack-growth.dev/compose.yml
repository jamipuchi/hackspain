services:
  coffee:
    image: ${CINTA_IMAGE:?Set CINTA_IMAGE to the reviewed immutable image ID}
    container_name: compose-coffee-1
    init: true
    restart: unless-stopped
    read_only: true
    environment:
      CINTA_INTERNAL_PORT: "8890"
      CINTA_PUBLIC_HOST: hack-growth.dev
      CINTA_PUBLIC_ORIGIN: https://hack-growth.dev
      CINTA_RUNS_ROOT: /var/lib/hackspain-coffee/runs
      CINTA_ITEM_CONTROL_ROOT: /var/lib/hackspain-coffee/item-control
      CINTA_ITEM_JOBS_PROVIDER: paid
      CINTA_PROVIDER_CACHE_ROOT: /var/lib/hackspain-coffee/provider-cache
      CINTA_PROVIDER_ENV: /run/secrets/cinta-provider.env
      CINTA_PHYSICS_REPLAY_ROOT: /run/cinta/provider-replay
      CINTA_RUNTIME_ROOT: /tmp/cinta-runtime
      CINTA_SOURCE_REVISION: ${CINTA_SOURCE_REVISION:?Set the full reviewed release SHA}
      HOME: /tmp/cinta-home
      XDG_CACHE_HOME: /tmp/cinta-home/cache
      XDG_CONFIG_HOME: /tmp/cinta-home/config
      XDG_STATE_HOME: /tmp/cinta-home/state
      TMPDIR: /tmp
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    expose:
      - "8890"
    volumes:
      - type: bind
        source: ${CINTA_RUNS_ROOT:-/srv/hackspain-coffee/runs}
        target: /var/lib/hackspain-coffee/runs
      - type: bind
        source: ${CINTA_ITEM_CONTROL_ROOT:-/srv/hackspain-coffee/item-control}
        target: /var/lib/hackspain-coffee/item-control
      - type: bind
        source: ${CINTA_PROVIDER_CACHE_ROOT:-/srv/hackspain-coffee/provider-cache}
        target: /var/lib/hackspain-coffee/provider-cache
      - type: bind
        source: ${CINTA_PROVIDER_ENV_FILE:-/srv/hackspain-coffee/secrets/generated-items.env}
        target: /run/secrets/cinta-provider.env
        read_only: true
      - type: bind
        source: ${CINTA_PHYSICS_REPLAY_ROOT:-/srv/hackspain-coffee/provider-replay}
        target: /run/cinta/provider-replay
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    networks:
      - coffee_shared
    cpus: "8.0"
    mem_limit: 8g
    pids_limit: 256
    shm_size: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "/app/deploy/check_live.py", "--window", "8"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

  caddy:
    environment:
      CINTA_OPERATOR_USER: ${CINTA_OPERATOR_USER:?Set the operator user}
      CINTA_OPERATOR_PASSWORD_HASH: ${CINTA_OPERATOR_PASSWORD_HASH:?Set the operator password hash}

networks:
  coffee_shared:
    external: true
    name: compose_default
